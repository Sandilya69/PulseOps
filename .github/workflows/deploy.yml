name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull backend image
        run: |
          docker pull ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Pull frontend image
        run: |
          docker pull ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

      - name: Deploy to ${{ github.event.inputs.environment }}
        run: |
          echo "Deploying to ${{ github.event.inputs.environment }}..."
          # Add your deployment commands here
          # Example for Railway:
          # railway up --service backend --image ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          # railway up --service frontend --image ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          
          # Example for Render:
          # curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          
          # Example for Vercel:
          # vercel --prod --token=$VERCEL_TOKEN
          
          # Example for Docker Compose on VPS:
          # docker compose -f docker-compose.prod.yml pull
          # docker compose -f docker-compose.prod.yml up -d